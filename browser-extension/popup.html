<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <style>
    body {
      width: 320px; padding: 14px;
      font-family: "Segoe UI", "Microsoft YaHei", sans-serif;
      background: #fffafc; color: #3a3040;
    }
    h1 { font-size: 15px; color: #c4586d; display: flex; align-items: center; gap: 6px; }
    label { font-size: 12px; color: #9a6b76; display: block; margin: 12px 0 4px; }
    input {
      width: 100%; padding: 7px 9px; font-size: 12.5px;
      border: 1px solid #f2dfe2; border-radius: 8px; background: #fff;
    }
    input:focus { outline: 1.5px solid #e07085; }
    .row { display: flex; gap: 8px; margin-top: 14px; }
    button {
      flex: 1; border: none; border-radius: 9px; padding: 8px 0;
      font-size: 12.5px; font-weight: 700; cursor: pointer;
    }
    .save { background: linear-gradient(135deg, #e07085, #c4586d); color: #fff; }
    .test { background: #f6e7ea; color: #c4586d; }
    .msg { font-size: 11.5px; margin-top: 10px; min-height: 18px; }
    .msg.ok { color: #3f8f57; }
    .msg.err { color: #c04545; }
    .tip { font-size: 11px; color: #b9a8ae; margin-top: 12px; line-height: 1.8; }
  </style>
</head>
<body>
  <h1>🐾 Quark → Gopeed 设置</h1>

  <label>Gopeed API 地址</label>
  <input id="gopeedBase" placeholder="http://127.0.0.1:16801" spellcheck="false" />

  <label>接口令牌（Gopeed 设置→高级→接口令牌，没设就留空）</label>
  <input id="gopeedToken" placeholder="留空 = 无认证" spellcheck="false" />

  <label>分享转存目录名（我的网盘根目录下）</label>
  <input id="saveDirName" placeholder="Gopeed推送" spellcheck="false" />

  <div class="row">
    <button class="test" id="test">测试连接</button>
    <button class="save" id="save">保存</button>
  </div>
  <div class="msg" id="msg"></div>

  <div class="tip">
    Gopeed 里要先开启 API：设置 → 高级 → 通讯协议选 TCP、填端口（默认 16801）。<br />
    使用：打开 pan.quark.cn，右下角点 🐾 → 勾选文件 → 推送。
  </div>

  <script src="popup.js"></script>
</body>
</html>
